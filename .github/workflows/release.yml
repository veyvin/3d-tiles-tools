name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CI: true
  NODE_VERSION: '18'

jobs:
  build-and-package:
    name: Package ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-name: linux-x64
            archive-extension: tar.gz
            node-arch: x64
          - os: windows-latest
            os-name: win-x64
            archive-extension: zip
            node-arch: x64
          - os: macos-13
            os-name: macos-x64
            archive-extension: tar.gz
            node-arch: x64
          - os: macos-14
            os-name: macos-arm64
            archive-extension: tar.gz
            node-arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }} (${{ matrix.node-arch }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: ${{ matrix.node-arch }}

      - name: Install all dependencies
        shell: bash
        run: |
          npm ci

      - name: Run build
        shell: bash
        run: |
          npm run build

      - name: Prune to production dependencies only
        shell: bash
        run: |
          npm prune --omit=dev
          echo "Production node_modules size:"
          du -sh node_modules

      - name: Prepare package directory
        shell: bash
        run: |
          PACKAGE_DIR="3d-tiles-tools-${{ matrix.os-name }}"
          mkdir -p "$PACKAGE_DIR"

          # Copy necessary files
          cp -r build "$PACKAGE_DIR/"
          cp -r node_modules "$PACKAGE_DIR/"
          cp package.json "$PACKAGE_DIR/"
          cp LICENSE.md "$PACKAGE_DIR/"
          cp README.md "$PACKAGE_DIR/"
          cp CHANGES.md "$PACKAGE_DIR/" 2>/dev/null || true

          echo "Package directory contents before scripts:"
          ls -la "$PACKAGE_DIR"

      - name: Create startup script (Unix)
        if: matrix.archive-extension == 'tar.gz'
        shell: bash
        run: |
          PACKAGE_DIR="3d-tiles-tools-${{ matrix.os-name }}"
          {
            printf '#!/usr/bin/env bash\n'
            printf 'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"\n'
            printf 'exec node "$SCRIPT_DIR/build/src/cli.mjs" "$@"\n'
          } > "$PACKAGE_DIR/3d-tiles-tools"
          chmod +x "$PACKAGE_DIR/3d-tiles-tools"
          echo "Created startup script:"
          cat "$PACKAGE_DIR/3d-tiles-tools"
          ls -la "$PACKAGE_DIR"

      - name: Create startup script (Windows)
        if: matrix.archive-extension == 'zip'
        shell: pwsh
        run: |
          $PackageDir = "3d-tiles-tools-${{ matrix.os-name }}"
          $scriptContent = @"
          @echo off
          setlocal
          set "SCRIPT_DIR=%~dp0"
          node "%SCRIPT_DIR%build\src\cli.mjs" %*
          "@
          # Remove leading whitespace from each line (heredoc indentation)
          $cleanContent = ($scriptContent -split "`r?`n" | ForEach-Object { $_.TrimStart() }) -join "`r`n"
          Set-Content -Path "$PackageDir\3d-tiles-tools.bat" -Value $cleanContent -Encoding ASCII
          Write-Host "Created startup script:"
          Get-Content "$PackageDir\3d-tiles-tools.bat"
          Get-ChildItem $PackageDir

      - name: Smoke test packaged tool (Unix)
        if: matrix.archive-extension == 'tar.gz'
        shell: bash
        run: |
          PACKAGE_DIR="3d-tiles-tools-${{ matrix.os-name }}"
          echo "=== Running smoke test ==="
          "$PACKAGE_DIR/3d-tiles-tools" --help
          echo "=== Smoke test passed ==="

      - name: Smoke test packaged tool (Windows)
        if: matrix.archive-extension == 'zip'
        shell: pwsh
        run: |
          $PackageDir = "3d-tiles-tools-${{ matrix.os-name }}"
          $BatPath = Join-Path $PackageDir "3d-tiles-tools.bat"
          Write-Host "=== Running smoke test ==="
          Write-Host "Script path: $BatPath"
          & $BatPath --help
          Write-Host "=== Smoke test passed ==="

      - name: Create archive (tar.gz)
        if: matrix.archive-extension == 'tar.gz'
        shell: bash
        run: |
          PACKAGE_DIR="3d-tiles-tools-${{ matrix.os-name }}"
          ARCHIVE_NAME="3d-tiles-tools-${{ matrix.os-name }}.tar.gz"
          tar -czf "$ARCHIVE_NAME" "$PACKAGE_DIR"
          echo "Created archive: $ARCHIVE_NAME"
          ls -lh "$ARCHIVE_NAME"

      - name: Create archive (zip)
        if: matrix.archive-extension == 'zip'
        shell: pwsh
        run: |
          $PackageDir = "3d-tiles-tools-${{ matrix.os-name }}"
          $ArchiveName = "3d-tiles-tools-${{ matrix.os-name }}.zip"
          Compress-Archive -Path $PackageDir -DestinationPath $ArchiveName -Force
          Write-Host "Created archive: $ArchiveName"
          Get-Item $ArchiveName | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3d-tiles-tools-${{ matrix.os-name }}
          path: 3d-tiles-tools-${{ matrix.os-name }}.${{ matrix.archive-extension }}
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-and-package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded artifacts
        run: |
          ls -laR artifacts/

      - name: Move artifacts to release directory
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -print0 | while IFS= read -r -d '' file; do
            mv "$file" release/
          done
          echo "Release files:"
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
